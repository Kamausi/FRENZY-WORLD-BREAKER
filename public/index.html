<script>
'use strict';

// ============================================================
// RAMPAGE REBUILT — v0.18.3 WEBGL2 / THREE.JS / ANATOMICAL BODY PASS 1
// One authoritative gameplay simulation. Three.js WebGL2 is primary;
// the existing Canvas2D scene is a compatibility fallback.
// ============================================================

const canvas = document.getElementById('game');
const glCanvas=document.getElementById('glGame');
let activeGraphics=null,graphicsError='',rendererMode='canvas2d';
const gpuStatus=document.getElementById('gpuStatus');
function setGpuStatus(message){gpuStatus.textContent=message;}
const ctx = canvas.getContext('2d');
if (!ctx) throw new Error('Canvas2D is unavailable in this browser.');

const MathSim = {
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  lerp:(a,b,t)=>a+(b-a)*t,
  smoothstep:(a,b,v)=>{const t=Math.max(0,Math.min(1,(v-a)/Math.max(1e-6,b-a)));return t*t*(3-2*t);},
  length:(x,y)=>Math.hypot(x,y),
  stress:(force,area)=>force/Math.max(.01,area),
  falloffStress:(force,distance,area=1)=>force/(Math.max(.08,area)*(1+distance*distance*.72)),
  springStep(position,velocity,target,stiffness,damping,dt){
    const a=(target-position)*stiffness-velocity*damping;
    velocity+=a*dt; position+=velocity*dt; return {position,velocity};
  },
  // Analytic curl field from a scalar stream function. Useful for dust/smoke without random jitter.
  curl(x,y,t){
    const ax=.73, ay=.57, phase=t*.42;
    const dPsiDy=-ay*Math.sin(ax*x+phase)*Math.sin(ay*y-phase*.61);
    const dPsiDx= ax*Math.cos(ax*x+phase)*Math.cos(ay*y-phase*.61);
    return {x:dPsiDy,y:-dPsiDx};
  },
  hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);},
  // Smooth value noise: n(x)=lerp(hash(floor(x)),hash(floor(x)+1),smoothstep(fract(x))).
  noise(x,seed=0){const i=Math.floor(x),t=x-i,u=t*t*(3-2*t);return this.lerp(this.hash(i*19.19+seed*73.7),this.hash((i+1)*19.19+seed*73.7),u);},
  // Normalized fractal Brownian motion: sum(a_k*n(2^k*x))/sum(a_k), a_k=2^-k.
  fbm(x,seed=0,octaves=4){let sum=0,weight=0,a=1,f=1;for(let k=0;k<octaves;k++){sum+=a*this.noise(x*f,seed+k*13);weight+=a;a*=.5;f*=2;}return sum/Math.max(weight,1e-6);},
  // Orthographic screen-space geometric error in pixels: epsilon_px=epsilon_world*H/viewHeight.
  projectedError(errorWorld,viewHeight,pixelHeight,depthScale=1){return Math.max(0,errorWorld)*Math.max(1,pixelHeight)/Math.max(.001,viewHeight)*Math.max(0,depthScale)/12;},
  // Gaussian radial displacement field; bounded, smooth, and zero at zero damage.
  deformation(x,y,cx,cy,radius,damage){const dx=x-cx,dy=y-cy,r=Math.max(.001,radius);return this.clamp(damage,0,1)*Math.exp(-(dx*dx+dy*dy)/(2*r*r));}
};

const DepthLayer={FAR_SKY:-4,FAR_CITY:-3,MID_CITY:-2,STREET_BACK:-1,WORLD:0,FOREGROUND:1,FX:2};
const WORLD={groundY:0,maxX:126};

const state={
  W:innerWidth,H:innerHeight,dpr:1,pixelRatio:1,renderScale:1,unit:48,time:0,lastT:performance.now(),score:0,rampage:0,destruction:0,
  shake:0,missionComplete:false,gameOver:false
};

function worldScale(){return Math.min(state.H/11.5,state.W/7.5);}
function depthParallax(z){return MathSim.clamp(1+z*.13,.35,1.16);}
function sx(x,z=0){return (x-camera.renderX*depthParallax(z))*state.unit+state.W*.19+z*state.unit*.08;}
function sy(y){const vh=state.H/Math.max(.001,state.unit);const shift=characterCameraFocusY(vh,player.y)-vh*.29;return state.H*.79-(y-shift)*state.unit;}

function roundedRectPath(c,x,y,w,h,r){
  const rr=Math.min(r,w*.5,h*.5);c.beginPath();c.moveTo(x+rr,y);c.lineTo(x+w-rr,y);c.quadraticCurveTo(x+w,y,x+w,y+rr);c.lineTo(x+w,y+h-rr);c.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);c.lineTo(x+rr,y+h);c.quadraticCurveTo(x,y+h,x,y+h-rr);c.lineTo(x,y+rr);c.quadraticCurveTo(x,y,x+rr,y);c.closePath();
}
function fillRound(c,x,y,w,h,r,fill){c.fillStyle=fill;roundedRectPath(c,x,y,w,h,r);c.fill();}
function poly(points,fill,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=fill;ctx.beginPath();points.forEach((p,i)=>{const X=sx(p[0],p[2]||0),Y=sy(p[1]);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});ctx.closePath();ctx.fill();ctx.restore();}

class SpringCamera{
  constructor(){this.x=0;this.vx=0;this.target=0;this.shakeX=0;}
  update(dt,target,shake){
    this.target=MathSim.clamp(target-2.7,0,WORLD.maxX-8);
    const s=MathSim.springStep(this.x,this.vx,this.target,46,12,Math.min(dt,.033));
    this.x=s.position;this.vx=s.velocity;
    this.shakeX=(MathSim.hash(state.time*37)-.5)*shake*.18;
  }
  get renderX(){return this.x+this.shakeX;}
}
const camera=new SpringCamera();


// ============================================================
// PERFORMANCE + VIRTUAL GEOMETRY CORE
// The current Canvas2D renderer emulates the same decision model that can later
// drive WebGL2/WebGPU meshlets, HLOD and GPU-driven rendering.
// ============================================================
class PerformanceMonitor{
  constructor(targetMs=1000/60){this.targetMs=targetMs;this.samples=[];this.maxSamples=240;this.ema=targetMs;this.updateMs=0;this.renderMs=0;}
  sample(frameMs,updateMs=0,renderMs=0){
    frameMs=Math.max(0,Number.isFinite(frameMs)?frameMs:this.targetMs);this.samples.push(frameMs);if(this.samples.length>this.maxSamples)this.samples.shift();
    this.ema=this.ema*.92+frameMs*.08;this.updateMs=updateMs;this.renderMs=renderMs;return this.ema;
  }
  percentile(p){if(!this.samples.length)return this.targetMs;const a=[...this.samples].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.max(0,Math.floor((a.length-1)*p)))];}
  snapshot(){return {frameEMA:this.ema,p50:this.percentile(.50),p95:this.percentile(.95),p99:this.percentile(.99),updateMs:this.updateMs,renderMs:this.renderMs,targetMs:this.targetMs};}
}
class FrameBudgetController{
  constructor(simulationBudgetMs=4.0){this.simulationBudgetMs=simulationBudgetMs;this.capacity=10;this.remaining=10;this.requiredWork=0;this.debt=0;}
  beginFrame(quality=1){this.capacity=Math.max(4,10*quality);this.remaining=this.capacity;this.requiredWork=0;}
  request(cost,priority=.5){cost=Math.max(0,cost);this.requiredWork+=cost;if(this.remaining>=cost){this.remaining-=cost;return true;}if(priority>=.86){this.remaining-=cost;return true;}return false;}
  endFrame(){this.debt=Math.max(0,this.requiredWork-this.capacity);return this.debt;}
}
class AdaptiveQualityController{
  constructor(targetMs=1000/60){this.targetMs=targetMs;this.quality=1;this.minQuality=.58;this.maxQuality=1;this.ema=targetMs;this.over=0;this.under=0;}
  sample(frameMs){this.ema=this.ema*.9+frameMs*.1;if(this.ema>this.targetMs*1.08){this.over++;this.under=0;}else if(this.ema<this.targetMs*.78){this.under++;this.over=Math.max(0,this.over-1);}else{this.over=Math.max(0,this.over-1);this.under=Math.max(0,this.under-1);}if(this.over>=8){this.quality=Math.max(this.minQuality,this.quality-.04);this.over=0;}if(this.under>=45){this.quality=Math.min(this.maxQuality,this.quality+.02);this.under=0;}return this.quality;}
  get lodBias(){return Math.round((1-this.quality)*3.2);}
}
class DynamicResolutionController{
  constructor(){this.scale=1;}
  desired(q){return q>=.92?1:q>=.80?.9:q>=.68?.8:.7;}
  update(q){const next=this.desired(q);const changed=Math.abs(next-this.scale)>.001;this.scale=next;return changed;}
}
class VisibilitySystem{
  bounds(margin=2){const vw=state.W/Math.max(1,state.unit);return {left:camera.renderX-vw*.24-margin,right:camera.renderX+vw*.94+margin};}
  isVisible(x,w=0,margin=2){const b=this.bounds(margin);return x+w>=b.left&&x<=b.right;}
  distanceToView(x,w=0){const b=this.bounds(0),mid=x+w*.5;if(mid<b.left)return b.left-mid;if(mid>b.right)return mid-b.right;return 0;}
}
class ScreenSpaceLODSystem{
  constructor(){this.fov=50*Math.PI/180;this.errorThreshold=2.2;}
  projectedPixels(worldHeight,worldX){const lateral=Math.abs(worldX-camera.renderX);const pseudoDepth=9+lateral*.52;return worldHeight*state.H/(2*pseudoDepth*Math.tan(this.fov*.5));}
  projectedError(geometricError,worldX){const lateral=Math.abs(worldX-camera.renderX),pseudoDepth=9+lateral*.52;return geometricError*state.H/(2*pseudoDepth*Math.tan(this.fov*.5));}
  choose(worldHeight,worldX,geometricError=.12,importance=0){const px=this.projectedPixels(worldHeight,worldX),err=this.projectedError(geometricError,worldX);let lod=px>330?0:px>210?1:px>115?2:px>55?3:px>15?4:5;if(err>this.errorThreshold&&lod>0)lod--;if(importance>.78)lod=Math.max(0,lod-1);lod=Math.min(5,lod+(performanceCore?performanceCore.adaptive.lodBias:0));return {lod,pixels:px,error:err};}
}
class PredictiveVisibilitySystem{
  constructor(horizon=1.35){this.horizon=horizon;}
  corridor(subject=player){const px=subject.x||0,vx=subject.vx||0,predictedX=px+vx*this.horizon;const pad=5+Math.min(8,Math.abs(vx)*.8);return {min:Math.min(px,predictedX)-pad,max:Math.max(px,predictedX)+pad,predictedX};}
  contains(x,w=0){const c=this.corridor();return x+w>=c.min&&x<=c.max;}
}
class StreamingPrioritySystem{
  score(entity){const visible=performanceCore.visibility.isVisible(entity.x,entity.w||0,1)?1:0;const dist=performanceCore.visibility.distanceToView(entity.x,entity.w||0);const proximity=1-MathSim.clamp(dist/32,0,1);const projected=MathSim.clamp(performanceCore.screenLOD.projectedPixels(entity.h||2,entity.x)/420,0,1);const future=performanceCore.predictive.contains(entity.x,entity.w||0)?1:0;const damage=entity.damageFraction||0;const recent=entity.lastImpact&&state.time-entity.lastImpact.time<2.2?1:0;const structural=(entity.collapsing||entity.dead)?.95:0;return MathSim.clamp(.27*visible+.17*projected+.14*proximity+.15*future+.13*damage+.08*recent+.06*structural,0,1);}
}
class ResidencyManager{
  stateFor(score){return score>=.68?'active':score>=.43?'resident':score>=.22?'prefetch':score>=.08?'compressed':'unloaded';}
  update(entity,score){entity._residency=this.stateFor(score);return entity._residency;}
}
class WorldChunkManager{
  constructor(entities,chunkSize=18){this.entities=entities;this.chunkSize=chunkSize;this.chunks=[];this.lastUpdate=-Infinity;this.lastCamera=-Infinity;this.lastRevision=-1;this.rebuild();}
  rebuild(){const max=Math.ceil(WORLD.maxX/this.chunkSize);this.chunks=Array.from({length:max},(_,i)=>({id:i,min:i*this.chunkSize,max:(i+1)*this.chunkSize,priority:0,state:'unloaded'}));}
  update(){const revision=this.entities.reduce((n,b)=>n+b._visualRevision,0),cam=camera.renderX;
    if(state.time-this.lastUpdate<.22&&Math.abs(cam-this.lastCamera)<.20&&revision===this.lastRevision)return this.chunks;
    this.lastUpdate=state.time;this.lastCamera=cam;this.lastRevision=revision;
    for(const c of this.chunks){let p=0;for(const e of performanceCore.spatial.queryRect(c.min,0,c.max-c.min,19))p=Math.max(p,performanceCore.streamingPriority.score(e));c.priority=p;c.state=performanceCore.residency.stateFor(p);}return this.chunks;
  }
  stateForX(x){const c=this.chunks[MathSim.clamp(Math.floor(x/this.chunkSize),0,this.chunks.length-1)];return c?c.state:'unloaded';}
  snapshot(){return this.chunks.map(c=>({id:c.id,priority:+c.priority.toFixed(3),state:c.state}));}
}
class SimulationLODSystem{
  hzFor(entity,priority){if(entity.collapsing||entity.lastImpact&&state.time-entity.lastImpact.time<1.2)return 60;if(priority>=.70)return 60;if(priority>=.48)return 30;if(priority>=.26)return 15;if(priority>=.10)return 7.5;return 2;}
  consume(entity,dt,hz){entity._simAccum=(entity._simAccum||0)+dt;const step=1/Math.max(1,hz);if(entity._simAccum+1e-8<step)return 0;const run=Math.min(.25,entity._simAccum);entity._simAccum=0;return run;}
}
class PhysicsLODSystem{
  levelFor(x){const visible=performanceCore.visibility.isVisible(x,0,3),dist=Math.abs(x-player.x);return visible&&dist<12?0:dist<26?1:dist<45?2:3;}
  hzFor(x){return [60,30,15,5][this.levelFor(x)];}
}
class AILODSystem{
  hzFor(enemy){const d=Math.abs(enemy.x-player.x),vis=performanceCore.visibility.isVisible(enemy.x,2,2);if(vis&&d<14)return 60;if(d<28)return 30;if(d<50)return 15;return 5;}
  consume(enemy,dt){const hz=this.hzFor(enemy);enemy._aiAccum=(enemy._aiAccum||0)+dt;if(enemy._aiAccum<1/hz)return 0;const step=enemy._aiAccum;enemy._aiAccum=0;return step;}
}
class DebrisBudgetSystem{
  currentBudget(){const q=performanceCore?performanceCore.adaptive.quality:1;return Math.round(90+170*q);}
  enforce(items,recycle=()=>{}){const budget=this.currentBudget();if(items.length<=budget)return 0;items.sort((a,b)=>{const pa=(a.dust?0:.3)+(a.life||0)*.1-(Math.abs(a.x-player.x)*.005),pb=(b.dust?0:.3)+(b.life||0)*.1-(Math.abs(b.x-player.x)*.005);return pb-pa;});const removed=items.length-budget;for(let i=budget;i<items.length;i++)recycle(items[i]);items.length=budget;return removed;}
}
class ParticleBudgetSystem{
  currentBudget(){const q=performanceCore?performanceCore.adaptive.quality:1;return Math.round(45+105*q);}
  enforce(items,recycle=()=>{}){let dust=0;for(const item of items)if(item.dust)dust++;const budget=this.currentBudget();if(dust<=budget)return 0;const remove=dust-budget;let left=remove;for(let i=items.length-1;i>=0&&left>0;i--){if(items[i].dust){recycle(items[i]);items.splice(i,1);left--;}}return remove;}
}
class VirtualGeometrySystem{

function updatePlayer(dt){

    const center=climbTarget.x+climbTarget.w*.5;player.x=MathSim.lerp(player.x,MathSim.clamp(player.x,climbTarget.x-.25,climbTarget.x+climbTarget.w-player.w+.25),Math.min(1,dt*10));

  if(!player.climbing){
    if(wantsJump&&(player.y<=.001||player.onRoof)){player.vy=8.6;player.onRoof=null;input.jump=false;}
    const prevY=player.y;player.vy-=20.5*dt;player.y+=player.vy*dt;
    player.x=MathSim.clamp(player.x+player.vx*dt,.4,WORLD.maxX-2.4);
    if(player.vy<=0){const roof=findRoofBelow(player.x+player.w*.5,prevY);if(roof&&player.y<=roof.h){player.y=roof.h;player.vy=0;player.onRoof=roof;}else if(player.y<=0){player.y=0;player.vy=0;player.onRoof=null;}}
    if(player.onRoof&&(player.x+player.w*.5<player.onRoof.x||player.x+player.w*.5>player.onRoof.x+player.onRoof.w||player.onRoof.dead)){player.onRoof=null;}

  player.walkT+=Math.abs(player.vx)*dt;

  if((input.punch||input.punchQueued)&&player.punch<=0){player.punch=.28;punchImpact();input.punch=false;input.punchQueued=false;}
  if((input.roar||input.roarQueued)&&player.roar<=0){player.roar=1.55;state.rampage=Math.min(100,state.rampage+10);state.shake=Math.min(1.2,state.shake+.3);debris.spawnImpact(player.x+player.w*.5,player.y+1.2,16,'#a9b5a9');input.roar=false;input.roarQueued=false;showBanner('ROAR!');}

// The 52-section specification is documented in master_generation_rendering_pipeline.md.
class MasterAssetPipeline {
  constructor(THREE){this.THREE=THREE;this.assetManifest=new Map();this.errors=[];this.nextId=1;this.stats={registered:0,validated:0,rejected:0};}

    if(!geometry||!geometry.isBufferGeometry)throw Error('Asset pipeline: BufferGeometry required');
    const position=geometry.getAttribute('position');
    if(!position||position.itemSize!==3||!position.count)throw Error('Asset pipeline: valid XYZ positions required');
    for(let i=0;i<position.array.length;i++)if(!Number.isFinite(position.array[i]))throw Error('Asset pipeline: non-finite geometry');

    if(contract.kind==='recessed-facade'){
      const {frameFront,glassFront,wallFront}=contract;

        throw Error('Visual pipeline: windows must sit behind their raised reveals and ahead of backing wall');
      return {kind:contract.kind,depth:frameFront-wallFront};
    }
    if(contract.kind==='organic'){
      const geometry=mesh.geometry,position=geometry.getAttribute('position'),normal=geometry.getAttribute('normal');
      if(!normal||normal.count!==position.count||normal.itemSize!==3)throw Error('Visual pipeline: organic mesh requires per-vertex normals');

      const b=geometry.boundingBox,extent=[b.max.x-b.min.x,b.max.y-b.min.y,b.max.z-b.min.z];

        throw Error('Visual pipeline: connected anatomy lost its required extents');

      for(let i=0;i<normal.count;i++){

      }

    }
    throw Error('Visual pipeline: unsupported visual contract');
  }
  validateCharacterDefinition(def){
    const fail=message=>{throw Error('Character pipeline: '+message);};
    if(!def||typeof def.id!=='string'||!def.id.trim()||typeof def.root!=='string')fail('id and root required');
    if(!Array.isArray(def.joints)||!def.joints.length)fail('joint hierarchy required');
    const byId=new Map();

    if(!['animation-driven','physics-driven','hybrid'].includes(def.simulation))fail('simulation authority required');

  }
  validateSkinnedMesh(mesh){
    const fail=m=>{throw Error('Character pipeline: '+m);};
    if(!mesh.skeleton||!mesh.skeleton.bones||!mesh.skeleton.bones.length)fail('skinned mesh needs a skeleton');
    const geom=mesh.geometry,index=geom.getAttribute('skinIndex'),weight=geom.getAttribute('skinWeight'),position=geom.getAttribute('position');

      fail('four skin indices and weights required per vertex');
    if(geom.morphAttributes&&geom.morphAttributes.position){for(const morph of geom.morphAttributes.position)
      if(morph.count!==position.count||morph.itemSize!==3)fail('corrective morph topology mismatch');}
    const numberOfBones=mesh.skeleton.bones.length;
    for(let v=0;v<position.count;v++){
      let sum=0;
      for(let j=0;j<4;j++){

        if(!Number.isInteger(bone)||bone<0||bone>=numberOfBones)fail('unknown bone index');
        if(!Number.isFinite(w)||w<0||w>1)fail('invalid skin weight');
        sum+=w;
      }
      if(Math.abs(sum-1)>1e-3)fail('skin weights not normalized');
    }
    return {bones:numberOfBones,vertices:position.count};
  }
  registerAsset(mesh,category='environment',metadata={}){
    try{
      const result=this.validateRuntimeAsset(mesh,category);
      if(mesh.isSkinnedMesh)this.validateSkinnedMesh(mesh);
      if(metadata.visualContract)this.validateVisualContract(mesh,metadata.visualContract);
      if(!mesh.userData.pipelineAssetId)mesh.userData.pipelineAssetId='asset-'+this.nextId++;
      this.assetManifest.set(mesh.userData.pipelineAssetId,{...result,...metadata});
      this.stats.registered=this.assetManifest.size;this.stats.validated++;
      return mesh;
    }catch(error){this.stats.rejected++;this.errors.push(String(error));throw error;}
  }
  validateAll(scene){
    let total=0;scene.traverse(obj=>{if(obj.isMesh){this.registerAsset(obj,obj.userData.assetCategory||'environment');total++;}});
    return {total,rejected:this.stats.rejected};
  }
}

// Gameplay and structural cells remain authoritative in the shared simulation.
// Deterministic pose targets are shared by runtime animation and regression tests.
function evaluateGeorgePose(p,t){
  const walk=Math.sin(p.walkT*5.2)*.21;
  const phase=p.punch>0?Math.max(0,Math.min(1,1-p.punch/.28)):0;
  const punch=Math.sin(phase*Math.PI);

  const roar=p.roar>0?Math.min(1,p.roar/.24):0;
  const facing=p.facing>=0?1:-1;
  const out={punchMorph:punch,climbMorph:climb,elbowMorph:Math.max(climb*.86,punch*.80)};
  out.root=climb?-.032:p.vx*.009;
  out.spineLower=p.vx*.008;

  out.chest=punch*.038*facing;
  out.neck=roar>0?-.05:0;

    out[`clavicle.${side}`]=s*(climb*.18+(front?punch*.115:0));

    out[`elbow.${side}`]=s*(climb*.57+(front?punch*.44:Math.max(0,walk)*.10));
    out[`wrist.${side}`]=-s*(climb*.22+(front?punch*.19:0));
    out[`hand.${side}`]=s*(climb*.06+(front?punch*.05:0));
    out[`thigh.${side}`]=climb*s*.19+(front?-walk:walk);
    out[`knee.${side}`]=climb*s*.21+s*Math.max(0,front?walk:-walk)*.22;
    out[`ankle.${side}`]=-out[`knee.${side}`]*.28;
  }
  return out;
}

      mesh.position.set(p.x,p.y,2.15);
      mesh.rotation.z=p.rot;
      const scale=p.size*(dust?2.2:1.55)*Math.max(.13,p.life/p.maxLife);
      mesh.scale.set(scale,scale,scale);
    }
    for(let i=items.length;i<this.debrisMeshes.length;i++)this.debrisMeshes[i].visible=false;
  }
  resize(){
    const width=Math.max(1,state.W),height=Math.max(1,state.H),vw=width/Math.max(.001,state.unit),vh=height/Math.max(.001,state.unit);
    this.camera.aspect=width/height;
    this.camera.updateProjectionMatrix();
    this.renderer.setPixelRatio(Math.min(2,Math.max(.55,state.dpr*state.renderScale)));
    this.renderer.setSize(width,height,false);
  }
  render(){
    const vw=state.W/state.unit,vh=state.H/state.unit;
    const cx=camera.renderX+(.5-.19)*vw,cy=characterCameraFocusY(vh,player.y);
    const distance=Math.max(11,vh/(2*Math.tan(this.camera.fov*Math.PI/360)));
    this.camera.position.set(cx+1.35,cy+.50,distance+1.55);
    this.camera.lookAt(cx,cy,-1.20);
    this.sun.position.set(cx+13,24,19);
    this.sun.target.position.set(cx,0,0);
    this.sun.target.updateMatrixWorld();
    performanceCore.telemetry.resetFrame();
    for(const m of this.buildings){this.updateBuilding(m);if(m.group.visible)performanceCore.telemetry.visibleBuildings++;}
    this.animateCharacter();this.animateEnemies();this.animateDebris();
    this.renderer.render(this.scene,this.camera);
    this.renderedFrames++;
    const info=this.renderer.info.render;
    performanceCore.telemetry.drawCalls=info.calls;
    if(PERF_HUD_MODE){const el=document.getElementById('perfHud'),t=performanceCore.telemetry.snapshot();el.style.display='block';el.textContent=`THREE / WEBGL2 • Q ${t.quality.toFixed(2)} • RES ${t.resolutionScale.toFixed(2)} • P95 ${t.p95.toFixed(1)}ms • DRAW ${info.calls} • TRIS ${info.triangles} • BLD ${t.visibleBuildings} • DEBRIS ${debris.items.length}`;}
  }
  dispose(){
    // Preserve gameplay; release GPU resources when the rendering backend fails.
    this.renderer.dispose();
  }
}

const PERF_HUD_MODE=/(?:\?|&)perf=1(?:&|$)/.test((location&&location.search)||'');
function applyCanvasResolution(){state.renderScale=performanceCore?performanceCore.dynamicResolution.scale:1;state.pixelRatio=state.dpr*state.renderScale;canvas.width=Math.max(1,Math.round(state.W*state.pixelRatio));canvas.height=Math.max(1,Math.round(state.H*state.pixelRatio));canvas.style.width=state.W+'px';canvas.style.height=state.H+'px';ctx.setTransform(state.pixelRatio,0,0,state.pixelRatio,0,0);if(activeGraphics)activeGraphics.resize();}
function render(force=false){
  state.unit=worldScale();const dirty=performanceCore.dirty.choose(force);if(dirty.mode==='skip')return;
  if(activeGraphics){
    try{activeGraphics.render();return;}
    catch(error){disableThree(error);}
  }
  performanceCore.telemetry.resetFrame();ctx.setTransform(state.pixelRatio,0,0,state.pixelRatio,0,0);ctx.save();
  if(dirty.mode==='partial'){ctx.beginPath();for(const r of dirty.rects)ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();}
  ctx.clearRect(0,0,state.W,state.H);environmentPipeline.render();drawEnemies();characterPipeline.render(ctx,player,state.time);debris.render();drawForeground();ctx.restore();
  if(PERF_HUD_MODE){const el=document.getElementById('perfHud'),t=performanceCore.telemetry.snapshot();el.style.display='block';el.textContent=`Q ${t.quality.toFixed(2)} • RES ${t.resolutionScale.toFixed(2)} • P95 ${t.p95.toFixed(1)}ms • LOD ${t.lodCounts.join('/')} • CELLS ${t.renderedCells} • CLUSTERS ${t.batchedClusters}/${t.clusterNodes} • OCC ${t.occluded} • POOL ${t.pool.reused} • DEBRIS ${debris.items.length}`;}
}

function resize(){state.dpr=Math.min(devicePixelRatio||1,2);state.W=innerWidth;state.H=innerHeight;state.unit=worldScale();applyCanvasResolution();performanceCore.dirty.invalidateFull();performanceCore.occlusion.invalidate();}

function bindButton(id,key){const el=document.getElementById(id);if(!el)return;el.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=true;input[key+'Queued']=true;try{el.setPointerCapture(e.pointerId)}catch(_){}});for(const evt of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(evt,e=>{e.preventDefault();input[key]=false;if(evt==='pointercancel')input[key+'Queued']=false;});}
bindButton('jump','jump');bindButton('punch','punch');bindButton('roar','roar');
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let stickId=null;
function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width*.5,cy=r.top+r.height*.5;let dx=e.clientX-cx,dy=e.clientY-cy;const lim=r.width*.4,m=Math.hypot(dx,dy);if(m>lim){dx=dx/m*lim;dy=dy/m*lim;}nub.style.transform=`translate(${dx}px,${dy}px)`;input.left=dx<-lim*.18;input.right=dx>lim*.18;}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;try{stick.setPointerCapture(stickId)}catch(_){}moveStick(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId){e.preventDefault();moveStick(e);}});for(const evt of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(evt,e=>{if(stickId===null||e.pointerId===stickId){stickId=null;nub.style.transform='';input.left=input.right=false;}});
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=true;if(e.code==='Space'||e.code==='ArrowUp'){if(!input.jump)input.jumpQueued=true;input.jump=true;}if(e.code==='KeyJ'||e.code==='KeyZ'){input.punch=true;input.punchQueued=true;}if(e.code==='KeyK'||e.code==='KeyX'){input.roar=true;input.roarQueued=true;}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=false;if(e.code==='Space'||e.code==='ArrowUp')input.jump=false;if(e.code==='KeyJ'||e.code==='KeyZ')input.punch=false;if(e.code==='KeyK'||e.code==='KeyX')input.roar=false;});
addEventListener('resize',resize,{passive:true});document.getElementById('restart').onclick=()=>location.reload();

window.__RAMPAGE_TEST__={
  version:'0.18.3',mode:'webgl2-three-primary',get rendererMode(){return rendererMode;},get graphicsError(){return graphicsError;},MathSim,DepthLayer,state,player,buildings,debris,input,camera,performanceCore,
  characterPose:evaluateGeorgePose,characterFocusY:characterCameraFocusY,characterGeometry:ProceduralGeometryV18,
  step:update,draw:render,resize,
  setPlayer(x,y=0){player.x=x;player.y=y;player.vx=player.vy=0;player.climbing=false;player.onRoof=null;camera.x=MathSim.clamp(x-2.7,0,WORLD.maxX-8);camera.vx=0;},
  impactBuilding(index,x,y,power=48){return buildings[index].applyImpact(x,y,power,1);},
  press(key){input[key]=true;update(1/60);if(key!=='jump')input[key]=false;},
  getLOD(index){return performanceCore.virtualGeometry.evaluate(buildings[index]).lod;},
  simulateFrameMs(ms,count=1){for(let i=0;i<count;i++){performanceCore.monitor.sample(ms);performanceCore.adaptive.sample(ms);}if(performanceCore.dynamicResolution.update(performanceCore.adaptive.quality)){applyCanvasResolution();performanceCore.dirty.invalidateFull();performanceCore.occlusion.invalidate();}return performanceCore.adaptive.quality;},
  diagnostics(){const t=performanceCore.telemetry.snapshot();return {renderer:rendererMode,graphicsError,finite:[player.x,player.y,player.vx,player.vy,camera.x,state.score,state.rampage,state.destruction,t.quality,t.resolutionScale,t.p95].every(Number.isFinite),destroyedCells:buildings.reduce((n,b)=>n+b.cells.filter(c=>c.destroyed).length,0),debris:debris.items.length,climbing:player.climbing,missionComplete:state.missionComplete,quality:t.quality,resolutionScale:t.resolutionScale,p95:t.p95,simulationDebt:t.simulationDebt,lodCounts:t.lodCounts,chunks:t.chunks,clusterNodes:t.clusterNodes,batchedClusters:t.batchedClusters,occluded:t.occluded,spatial:t.spatial,pool:t.pool,dirty:t.dirty,temporal:t.temporal};}
};


function disableThree(reason){
  graphicsError=String(reason&&reason.message||reason||'Unknown WebGL failure');
  const old=activeGraphics;activeGraphics=null;rendererMode='canvas2d';
  glCanvas.style.display='none';canvas.style.display='block';
  if(old&&old.dispose)try{old.dispose();}catch(_){}
  gpuStatus.title=graphicsError;setGpuStatus('2D FALLBACK · RENDERER ERROR');
  performanceCore.dirty.invalidateFull();
}
window.__RAMPAGE_ATTACH_THREE__=function(backend){
  if(!backend||typeof backend.render!=='function'||typeof backend.resize!=='function')throw Error('Invalid graphics backend');
  if(activeGraphics&&activeGraphics.dispose)try{activeGraphics.dispose();}catch(_){}
  activeGraphics=backend;graphicsError='';rendererMode='webgl-three';
  activeGraphics.resize();
  glCanvas.style.display='block';canvas.style.display='none';
  setGpuStatus('THREE.JS • WEBGL2');
  performanceCore.dirty.invalidateFull();render(true);
};
// A separate canvas prevents the historical 2D-context/WebGL-context collision.
glCanvas.addEventListener('webglcontextlost',event=>{
  event.preventDefault();disableThree('WebGL context lost');render(true);
});
glCanvas.addEventListener('webglcontextrestored',()=>{
  if(rendererMode!=='webgl-three')startThree();
});
let threeLoading=false;
async function startThree(){
  if(threeLoading||rendererMode==='webgl-three')return;
  const params=new URLSearchParams(location.search);
  if(params.get('renderer')==='2d'||window.__RAMPAGE_DISABLE_GPU__)return;
  if(STATIC_TEST_MODE&&!params.has('threeTest'))return;
  threeLoading=true;
  try{
    // r180 requires WebGL2. Avoid touching the Canvas2D context.
    const context=glCanvas.getContext('webgl2',{alpha:false,antialias:false,depth:true,powerPreference:'high-performance'});
    if(!context){setGpuStatus('2D FALLBACK · NO WEBGL2');return;}
    let loadError;
    for(const url of [
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js',
      'https://unpkg.com/three@0.180.0/build/three.module.js'
    ]){
      try{
        const THREE=await import(url);
        const backend=new ThreeGameRenderer(THREE,glCanvas,context);
        window.__RAMPAGE_ATTACH_THREE__(backend);
        return;
      }catch(error){loadError=error;}
    }
    disableThree(loadError||Error('Three.js failed to load'));
  }catch(error){disableThree(error);}
  finally{threeLoading=false;}
}

resize();
function loop(t){const frameInterval=Math.min(100,Math.max(0,t-state.lastT));const dt=Math.min(.033,frameInterval/1000);state.lastT=t;const u0=performance.now();update(dt);const u1=performance.now();render();const u2=performance.now();performanceCore.monitor.sample(frameInterval||16.67,u1-u0,u2-u1);performanceCore.adaptive.sample(frameInterval||16.67);if(performanceCore.dynamicResolution.update(performanceCore.adaptive.quality)){applyCanvasResolution();performanceCore.dirty.invalidateFull();performanceCore.occlusion.invalidate();}requestAnimationFrame(loop);}
const STATIC_TEST_MODE=/(?:\?|&)static=1(?:&|$)/.test((location&&location.search)||'');
if(STATIC_TEST_MODE){update(1/60);render();}else requestAnimationFrame(loop);
startThree();

</script>
